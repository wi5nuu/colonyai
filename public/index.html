<!doctype html>
<html>
  <head>
    <title>AI Agent</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        width: 500px;
        height: 700px;
        display: flex;
        flex-direction: column;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
        background: #111827;
      }

      .header {
        padding: 15px;
        background: #1f2937;
        font-weight: bold;
        text-align: center;
      }

      #chat {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 80%;
        padding: 10px 12px;
        border-radius: 12px;
        word-wrap: break-word;
        font-size: 14px;
      }

      .user {
        align-self: flex-end;
        background: #3b82f6;
      }

      .ai {
        align-self: flex-start;
        background: #374151;
      }

      .typing {
        font-style: italic;
        opacity: 0.7;
      }

      .input-box {
        display: flex;
        border-top: 1px solid #334155;
      }

      input {
        flex: 1;
        padding: 12px;
        border: none;
        outline: none;
        background: #0b1220;
        color: white;
      }

      button {
        padding: 12px 18px;
        border: none;
        background: #22c55e;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        background: #16a34a;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">🤖 AI AGENT (Claude Powered)</div>

      <div id="chat"></div>

      <div class="input-box">
        <input id="msg" placeholder="Tulis perintah ke AI Agent..." />
        <button onclick="send()">Kirim</button>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById("chat");

      function addMessage(role, text, type = "") {
        const div = document.createElement("div");
        div.classList.add("msg");

        if (role === "user") div.classList.add("user");
        else div.classList.add("ai");

        if (type === "typing") div.classList.add("typing");

        div.innerText = text;

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;

        return div;
      }

      async function send() {
        const input = document.getElementById("msg");
        const msg = input.value.trim();

        if (!msg) return;

        input.value = "";

        // tampilkan user message
        addMessage("user", msg);

        // typing indicator
        const typing = addMessage("ai", "AI sedang berpikir...", "typing");

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
          });

          const data = await res.json();

          // hapus typing
          typing.remove();

          // tampilkan jawaban AI
          addMessage("ai", data.reply);
        } catch (err) {
          typing.remove();
          addMessage("ai", "❌ Error koneksi ke server");
        }
      }
    </script>
  </body>
</html>
